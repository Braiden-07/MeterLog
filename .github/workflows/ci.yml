name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_DB: meterlog
  MIGRATOR_PASSWORD: ci_migrator_password
  APP_PASSWORD: ci_app_password

jobs:
  verify:
    # DO NOT RENAME THIS JOB. It is the required status-check CONTEXT in the
    # `main` ruleset, matched by exact string. Step 7a renamed it to
    # "docs · lint · typecheck · test" to advertise the new citation step, and
    # that silently made every PR unmergeable: the required context
    # "lint · typecheck · test" no longer existed, so it could never report, and
    # GitHub showed a GREEN check next to a permanently BLOCKED merge button.
    #
    # The failure mode is the one this repo keeps meeting — not a wrong answer, a
    # check that cannot run. Nothing was red; the PR simply could not merge, and
    # the reason was visible only in the ruleset, not in the run.
    #
    # The docs step advertises itself where it actually helps: its own STEP name,
    # "Check doc citations", which is what the run summary shows on failure. The
    # job name buys nothing and costs the merge contract.
    #
    # If this name must ever change, the ruleset's required_status_checks context
    # has to change in the same breath — repository settings, not this file.
    name: lint · typecheck · test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          # The cluster bootstrap user is the MIGRATION/owner role. The app and
          # definer roles are created by migration SQL below — GitHub Actions
          # service containers cannot mount the local init script, which is
          # precisely why ADR-004 puts the role bootstrap in a migration.
          POSTGRES_USER: meterlog_migrator
          POSTGRES_PASSWORD: ci_migrator_password
          POSTGRES_DB: meterlog
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U meterlog_migrator -d meterlog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MIGRATION_DATABASE_URL: postgresql://meterlog_migrator:ci_migrator_password@localhost:5432/meterlog?schema=public
      DATABASE_URL: postgresql://meterlog_app:ci_app_password@localhost:5432/meterlog?schema=public
      REDIS_URL: redis://localhost:6379
      # Not a secret: it signs session cookies for the throwaway CI database only.
      # A real value comes from the platform secret store at deploy (ARCHITECTURE §16).
      # It must be SET, though — SessionService refuses to construct without one,
      # deliberately, so an unsigned-cookie deployment is impossible by accident.
      SESSION_SECRET: ci_session_secret_not_used_outside_ci

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Check the citation checker
        # BEFORE `docs:check`, and the order is the argument. If the guard has
        # stopped guarding, the next step's green means nothing — "docs citations
        # OK" is exactly as true of a checker that no longer checks. So the tool
        # is proven against a fixture corpus of known-bad and known-good trees
        # first, and only then used.
        #
        # That is not hypothetical: the register carried three blind mechanisms
        # for four slices while this workflow stayed green through all of them,
        # and two real drifts landed on `main` underneath that green. The corpus
        # also runs a mutation pass, so a future weakening of either rule reds
        # here rather than going quiet.
        run: npm run docs:check:self

      - name: Check doc citations
        # ITS OWN STEP, DELIBERATELY (step 7 phase 7a, Part 0). Folding this into
        # `test` would make citation drift surface as a red test among 300 others,
        # named after whichever spec file happened to host the check. As a named
        # step the GitHub summary says "Check doc citations" and nothing else, so
        # the failure names its own cause.
        #
        # Positioned before lint/typecheck/test so it fails the gate FAST: it needs
        # no database, no Prisma client and no build, and a docs-only PR should not
        # wait on a Postgres service container to be told an anchor slid.
        #
        # It exists because nothing checked `file#Lnn` anchors before, which is why
        # phase 3d's drifted and phase 4 rationally retreated to file-level links.
        run: npm run docs:check

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run migrations
        # Creates meterlog_definer and meterlog_app, applies role attributes,
        # timeouts and schema grants.
        run: npm run db:migrate:deploy

      - name: Give the app role a password
        # Deliberately not in the migration: passwords never enter version
        # control. Locally the docker init script does this; on Render it is a
        # one-time documented step.
        run: |
          PGPASSWORD="$MIGRATOR_PASSWORD" psql \
            -h localhost -U meterlog_migrator -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 \
            -c "ALTER ROLE meterlog_app WITH LOGIN PASSWORD '$APP_PASSWORD';"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        # Includes all three database suites — catalog RLS coverage, the
        # catalog-driven isolation harness, and the definer probe — each running
        # as meterlog_app against the Postgres service above.
        #
        # CORRECTED AT THE PLAYWRIGHT E2E PR: this said "the web workspace
        # passes with no test files", which was true when written and has not
        # been since the frontend slice. The web workspace now has six spec
        # files and `--passWithNoTests` was deliberately removed from its script,
        # so an empty frontend suite FAILS here too — which is the property the
        # sentence was reaching for and no longer described.
        #
        # It does NOT run the Playwright journeys: `apps/web/vitest.config.ts`
        # excludes `e2e/**`, and its `include` covers only app/components/lib, so
        # the e2e specs are unreachable from here twice over. They run in the
        # separate `e2e` job below, which owns the browser and the app servers.
        run: npm run test

      - name: Build
        run: npm run build

  # ===========================================================================
  # THE E2E JOB — SEPARATE, AND THE SEPARATION IS THE POINT
  #
  # It is NOT folded into `verify`. That job's NAME is the required status-check
  # context in the `main` ruleset (see the comment at the top of this file), and
  # reshaping it is the one edit that has already broken mergeability once.
  #
  # NAMED `e2e`, WITH NO MIDDLE DOT, DELIBERATELY. The required context is matched
  # by exact string, and `verify`'s name carries a `·` (U+00B7) that already turns
  # up mojibaked in API output. A second dotted name would double the chance of a
  # ruleset entry that looks right in the settings UI and matches nothing.
  #
  # NO `paths` / `paths-ignore` FILTER, DELIBERATELY. A skipped job never reports,
  # and a REQUIRED context that never reports blocks the merge permanently — the
  # same incident this file already records, reached through a different door. It
  # runs on every pull request or it is not required.
  #
  # IT SHARES NOTHING WITH `verify` AUTOMATICALLY: services, env and the whole
  # install/migrate sequence are per-job in Actions, so they are repeated here
  # rather than inherited.
  #
  # NOTE FOR WHOEVER MERGES THIS: adding the job does NOT make it required. The
  # ruleset lists its required contexts explicitly, and `e2e` has to be added
  # there as a second one, in repository settings, deliberately. Until it is, a
  # red run here does not block anything.
  # ===========================================================================
  e2e:
    name: e2e
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: meterlog_migrator
          POSTGRES_PASSWORD: ci_migrator_password
          POSTGRES_DB: meterlog
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U meterlog_migrator -d meterlog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MIGRATION_DATABASE_URL: postgresql://meterlog_migrator:ci_migrator_password@localhost:5432/meterlog?schema=public
      DATABASE_URL: postgresql://meterlog_app:ci_app_password@localhost:5432/meterlog?schema=public
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci_session_secret_not_used_outside_ci
      # NODE_ENV IS DELIBERATELY NOT SET HERE. The session cookie is
      # `secure: NODE_ENV === 'production'`, and a Secure cookie is never sent
      # over http://localhost — a production-mode API would make every journey
      # fail to authenticate for a reason that looks nothing like the cause. The
      # API process is pinned to `NODE_ENV=test` where it is actually started
      # (`webServer` in apps/web/playwright.config.ts); setting it job-wide would
      # also reach `next start`, which manages its own and expects a production
      # build.

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run migrations
        run: npm run db:migrate:deploy

      - name: Give the app role a password
        run: |
          PGPASSWORD="$MIGRATOR_PASSWORD" psql \
            -h localhost -U meterlog_migrator -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 \
            -c "ALTER ROLE meterlog_app WITH LOGIN PASSWORD '$APP_PASSWORD';"

      - name: Build
        # The journeys run the BUILT artefacts — `node dist/main.js` and
        # `next start` — so this is a prerequisite of the run, not a duplicate of
        # the verify job's build.
        run: npm run build

      - name: Install Playwright browsers
        # Chromium only: the config declares no `projects`, so one browser is the
        # whole matrix. `--with-deps` pulls the system libraries the runner lacks.
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: E2E
        # Playwright starts and stops the API and the web server itself
        # (`webServer`), so there is no start step here and no orphan process
        # afterwards.
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
